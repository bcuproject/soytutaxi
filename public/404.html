<!doctype html>
<html><head><meta charset="utf-8"><title>SoyTuTaxi</title>
<script>
  // SPA fallback for GitHub Pages: remember the deep link and load the app root.
  try { sessionStorage.setItem("stt_redirect", location.pathname + location.search + location.hash); } catch (e) {}
  var seg = location.pathname.split("/")[1];
  location.replace(location.origin + (location.hostname.endsWith("github.io") && seg ? "/" + seg + "/" : "/"));
</script></head><body></body></html>
