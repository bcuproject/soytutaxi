name: driver-app
# Builds the SoyTuTaxi Chofer Android app and publishes it as a GitHub release.
# Fixed download link: https://github.com/bcuproject/soytutaxi/releases/latest/download/soytutaxi-chofer.apk
on:
  push:
    branches: [main]
    paths: ["driver-app/**", ".github/workflows/driver-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create the Android project around lib/ (keeps our manifest)
        run: flutter create --org app.soytutaxi --project-name soytutaxi_driver --platforms android .
      - name: Packages (latest versions that fit this Flutter)
        run: |
          flutter pub add webview_flutter geolocator flutter_local_notifications http url_launcher
          flutter pub add --dev flutter_launcher_icons
      - name: App icon
        run: |
          cat >> pubspec.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/icon.png
            adaptive_icon_background: "#F5C518"
            adaptive_icon_foreground: assets/icon_fg.png
          YAML
          dart run flutter_launcher_icons
      - name: Signing key
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload.jks
      - run: python3 tool/patch_android.py
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Build
        run: |
          V="--build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}"
          flutter build apk --release $V
          cp build/app/outputs/flutter-apk/app-release.apk ../soytutaxi-chofer.apk
          flutter build apk --release --split-per-abi $V
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../soytutaxi-chofer-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../soytutaxi-chofer-arm32.apk
      - name: Check the APKs (complete, signed, minimum Android)
        run: |
          set -o pipefail
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cd ..
          {
            echo "App de choferes de SoyTuTaxi para Android."
            echo ""
            echo "Descarga (todos los teléfonos): https://github.com/bcuproject/soytutaxi/releases/latest/download/soytutaxi-chofer.apk"
            echo "Más liviana (la mayoría de los teléfonos de los últimos años): https://github.com/bcuproject/soytutaxi/releases/latest/download/soytutaxi-chofer-arm64.apk"
            echo "Bajala con Chrome (no desde WhatsApp) y abrí el archivo desde Descargas."
            echo ""
            if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "⚠️ Versión de prueba (firma de prueba): al pasar a la definitiva hay que desinstalarla una vez."; else echo "Firmada con la clave de SoyTuTaxi: las actualizaciones se instalan encima."; fi
            echo ""
            for f in soytutaxi-chofer.apk soytutaxi-chofer-arm64.apk soytutaxi-chofer-arm32.apk; do
              "$BT/apksigner" verify "$f" >/dev/null || { echo "::error::$f: firma inválida"; exit 1; }
              unzip -tq "$f" >/dev/null || { echo "::error::$f: archivo dañado"; exit 1; }
              MIN=$("$BT/aapt2" dump badging "$f" | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p")
              SIZE=$(du -m "$f" | cut -f1)
              echo "- \`$f\`: ${SIZE} MB · Android API ${MIN}+ · firma OK"
            done
          } | tee apk-check.md
          echo "MINSDK=$("$BT/aapt2" dump badging soytutaxi-chofer.apk | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p")" >> $GITHUB_ENV
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-v1.0.${{ github.run_number }}
          name: SoyTuTaxi Chofer 1.0.${{ github.run_number }}
          make_latest: "true"
          files: |
            soytutaxi-chofer.apk
            soytutaxi-chofer-arm64.apk
            soytutaxi-chofer-arm32.apk
          body_path: apk-check.md
