# Minimal Supabase CLI config. Run `supabase init` in a fresh checkout if the CLI asks for more keys.
project_id = "soytutaxi"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Passengers call the API anonymously; staff send their own access token, verified in the function.
[functions.api]
verify_jwt = false
